<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest for Fitness - DnD Exercise Tracker</title>
    <meta name="theme-color" content="#1a0f0f">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #1a0f0f;
            --bg-medium: #2d1b1b;
            --bg-light: #3d2424;
            --accent-gold: #d4af37;
            --accent-red: #8b0000;
            --accent-green: #2d5016;
            --text-light: #f5e6d3;
            --text-dim: #c4a57b;
            --border-ornate: #6b4423;
            --stat-str: #c41e3a;
            --stat-dex: #0070dd;
            --stat-con: #ff7d0a;
            --stat-int: #69ccf0;
            --stat-wis: #abd473;
            --stat-cha: #f58cba;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Pro', serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(139, 0, 0, 0.03) 0%, transparent 50%),
                url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence baseFrequency="0.9" numOctaves="4"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.03"/%3E%3C/svg%3E');
        }

        h1, h2, h3, h4 {
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 3px double var(--border-ornate);
            margin-bottom: 30px;
            position: relative;
        }

        header::before,
        header::after {
            content: '⚔';
            position: absolute;
            font-size: 2em;
            color: var(--accent-gold);
            opacity: 0.3;
        }

        header::before { left: 20px; top: 50%; transform: translateY(-50%) rotate(-45deg); }
        header::after { right: 20px; top: 50%; transform: translateY(-50%) rotate(45deg); }

        h1 {
            font-size: 3em;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2em;
            color: var(--text-dim);
            font-style: italic;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-tab {
            padding: 12px 24px;
            background: var(--bg-medium);
            border: 2px solid var(--border-ornate);
            border-radius: 0;
            color: var(--text-dim);
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 1em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: left 0.5s;
        }

        .nav-tab:hover::before {
            left: 100%;
        }

        .nav-tab:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .nav-tab.active {
            background: var(--accent-gold);
            color: var(--bg-dark);
            border-color: var(--accent-gold);
            font-weight: 600;
        }

        /* View Sections */
        .view {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Character Creation */
        .creation-panel {
            background: var(--bg-medium);
            border: 3px solid var(--border-ornate);
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-gold);
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 2px solid var(--border-ornate);
            color: var(--text-light);
            font-family: 'Crimson Pro', serif;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        button {
            padding: 15px 40px;
            background: var(--accent-gold);
            color: var(--bg-dark);
            border: none;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        button:hover {
            background: #f0c74b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Character Sheet */
        .character-sheet {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 900px) {
            .character-sheet {
                grid-template-columns: 1fr;
            }
        }

        .stat-block {
            background: var(--bg-medium);
            border: 3px solid var(--border-ornate);
            padding: 25px;
        }

        .character-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-ornate);
        }

        .character-name {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .character-details {
            color: var(--text-dim);
            font-size: 1em;
        }

        .level-display {
            background: var(--accent-red);
            color: var(--text-light);
            padding: 8px 16px;
            display: inline-block;
            margin-top: 10px;
            font-family: 'Cinzel', serif;
            font-weight: 600;
        }

        .xp-bar-container {
            margin-top: 15px;
        }

        .xp-bar {
            height: 20px;
            background: var(--bg-dark);
            border: 2px solid var(--border-ornate);
            position: relative;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-gold), #f0c74b);
            transition: width 0.5s ease;
            position: relative;
        }

        .xp-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .xp-text {
            text-align: center;
            margin-top: 5px;
            font-size: 0.9em;
            color: var(--text-dim);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: var(--bg-dark);
            padding: 15px;
            text-align: center;
            border: 2px solid var(--border-ornate);
            position: relative;
        }

        .stat-name {
            font-family: 'Cinzel', serif;
            font-size: 0.9em;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            font-family: 'Cinzel', serif;
        }

        .stat-modifier {
            font-size: 1em;
            color: var(--text-dim);
        }

        /* Quest Log */
        .quest-container {
            background: var(--bg-medium);
            border: 3px solid var(--border-ornate);
            padding: 25px;
            margin-bottom: 20px;
        }

        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .quest-item {
            background: var(--bg-dark);
            border-left: 4px solid var(--accent-gold);
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .quest-item:hover {
            border-left-width: 8px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .quest-item.daily { border-left-color: var(--stat-str); }
        .quest-item.weekly { border-left-color: var(--stat-int); }
        .quest-item.epic { border-left-color: var(--stat-cha); }

        .quest-title {
            font-family: 'Cinzel', serif;
            font-size: 1.3em;
            margin-bottom: 10px;
            color: var(--accent-gold);
        }

        .quest-description {
            color: var(--text-dim);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .quest-progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex: 1;
            height: 12px;
            background: var(--bg-medium);
            border: 1px solid var(--border-ornate);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-green), #4a7c30);
            transition: width 0.5s ease;
        }

        .quest-rewards {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .reward-badge {
            background: var(--accent-gold);
            color: var(--bg-dark);
            padding: 5px 12px;
            font-size: 0.85em;
            font-weight: 600;
            font-family: 'Cinzel', serif;
        }

        /* Workout Logger */
        .workout-form {
            background: var(--bg-medium);
            border: 3px solid var(--border-ornate);
            padding: 30px;
            margin-bottom: 30px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Achievements */
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .achievement-card {
            background: var(--bg-medium);
            border: 3px solid var(--border-ornate);
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .achievement-card.unlocked {
            border-color: var(--accent-gold);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
        }

        .achievement-card.locked {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .achievement-icon {
            font-size: 3em;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        }

        .achievement-name {
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: var(--accent-gold);
        }

        .achievement-desc {
            font-size: 0.9em;
            color: var(--text-dim);
        }

        /* Workout History */
        .history-table {
            width: 100%;
            background: var(--bg-medium);
            border: 3px solid var(--border-ornate);
        }

        .history-table th {
            background: var(--bg-dark);
            padding: 15px;
            text-align: left;
            font-family: 'Cinzel', serif;
            color: var(--accent-gold);
            border-bottom: 2px solid var(--border-ornate);
        }

        .history-table td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-ornate);
        }

        .history-table tr:hover {
            background: var(--bg-light);
        }

        /* Loot Drop Animation */
        @keyframes lootDrop {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(0) rotate(360deg); opacity: 1; }
        }

        .loot-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-medium);
            border: 4px solid var(--accent-gold);
            padding: 40px;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.8);
            animation: lootDrop 1s ease;
            text-align: center;
        }

        .loot-notification h3 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .loot-item {
            font-size: 1.5em;
            color: var(--accent-gold);
            margin: 10px 0;
        }

        /* Utility Classes */
        .text-center { text-align: center; }
        .mb-20 { margin-bottom: 20px; }
        .mt-20 { margin-top: 20px; }
        
        .btn-secondary {
            background: var(--bg-light);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
        }

        .btn-secondary:hover {
            background: var(--accent-gold);
            color: var(--bg-dark);
        }

        .hidden { display: none; }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .creation-panel { padding: 20px; }
            .stats-grid { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
        }

        /* Loading Animation */
        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading::after {
            content: '⚔';
            font-size: 3em;
            color: var(--accent-gold);
            animation: spin 2s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚔️ QUEST FOR FITNESS ⚔️</h1>
            <p class="subtitle">Your Journey to Epic Health Begins</p>
        </header>

        <nav class="nav-tabs" id="mainNav">
            <button class="nav-tab active" data-view="character">Character</button>
            <button class="nav-tab" data-view="quests">Quest Log</button>
            <button class="nav-tab" data-view="workout">Log Workout</button>
            <button class="nav-tab" data-view="achievements">Achievements</button>
            <button class="nav-tab" data-view="history">History</button>
            <button class="nav-tab" data-view="settings">Settings</button>
        </nav>

        <!-- Character Creation View -->
        <div id="characterCreation" class="view active">
            <div class="creation-panel">
                <h2 class="text-center mb-20">Create Your Hero</h2>
                <form id="characterForm">
                    <div class="form-group">
                        <label for="charName">Character Name</label>
                        <input type="text" id="charName" required placeholder="Enter your hero's name">
                    </div>
                    
                    <div class="form-group">
                        <label for="charRace">Race</label>
                        <select id="charRace" required>
                            <option value="">Choose your race</option>
                            <option value="human">Human</option>
                            <option value="elf">Elf</option>
                            <option value="dwarf">Dwarf</option>
                            <option value="halfling">Halfling</option>
                            <option value="dragonborn">Dragonborn</option>
                            <option value="gnome">Gnome</option>
                            <option value="half-elf">Half-Elf</option>
                            <option value="half-orc">Half-Orc</option>
                            <option value="tiefling">Tiefling</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="charClass">Class</label>
                        <select id="charClass" required>
                            <option value="">Choose your class</option>
                            <option value="barbarian">Barbarian</option>
                            <option value="bard">Bard</option>
                            <option value="cleric">Cleric</option>
                            <option value="druid">Druid</option>
                            <option value="fighter">Fighter</option>
                            <option value="monk">Monk</option>
                            <option value="paladin">Paladin</option>
                            <option value="ranger">Ranger</option>
                            <option value="rogue">Rogue</option>
                            <option value="sorcerer">Sorcerer</option>
                            <option value="warlock">Warlock</option>
                            <option value="wizard">Wizard</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="charSex">Sex</label>
                            <select id="charSex" required>
                                <option value="">Choose</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="charAge">Age</label>
                            <input type="number" id="charAge" required min="1" max="999" placeholder="Age">
                        </div>
                    </div>

                    <div class="text-center mt-20">
                        <button type="submit">Begin Your Quest</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Character Sheet View -->
        <div id="characterView" class="view">
            <div class="character-sheet">
                <div class="stat-block">
                    <div class="character-header">
                        <h2 class="character-name" id="displayName">Hero Name</h2>
                        <div class="character-details" id="displayDetails">Level 1 Human Fighter</div>
                        <div class="level-display" id="levelDisplay">LEVEL 1</div>
                        <div class="xp-bar-container">
                            <div class="xp-bar">
                                <div class="xp-fill" id="xpFill" style="width: 0%"></div>
                            </div>
                            <div class="xp-text" id="xpText">0 / 300 XP</div>
                        </div>
                    </div>

                    <div class="stats-grid" id="statsGrid">
                        <!-- Stats will be populated by JavaScript -->
                    </div>
                </div>

                <div>
                    <div class="stat-block">
                        <h3 class="mb-20">Active Quests</h3>
                        <div id="activeQuestsSummary">
                            <!-- Active quests summary -->
                        </div>
                    </div>

                    <div class="stat-block mt-20">
                        <h3 class="mb-20">Recent Achievements</h3>
                        <div id="recentAchievements">
                            <!-- Recent achievements -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quest Log View -->
        <div id="questsView" class="view">
            <div class="quest-container">
                <div class="quest-header">
                    <h2>Quest Log</h2>
                    <button onclick="addNewQuest()">+ New Quest</button>
                </div>
                <div id="questList">
                    <!-- Quests will be populated here -->
                </div>
            </div>
        </div>

        <!-- Workout Logger View -->
        <div id="workoutView" class="view">
            <div class="workout-form">
                <h2 class="mb-20">Log Your Training</h2>
                <form id="workoutForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exerciseType">Exercise Type</label>
                            <select id="exerciseType" required>
                                <option value="">Select exercise</option>
                                <option value="cardio">Cardio</option>
                                <option value="strength">Strength Training</option>
                                <option value="flexibility">Flexibility/Yoga</option>
                                <option value="sports">Sports</option>
                                <option value="martial-arts">Martial Arts</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="exerciseName">Exercise Name</label>
                            <input type="text" id="exerciseName" required placeholder="e.g., Running, Deadlift">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="duration">Duration (minutes)</label>
                            <input type="number" id="duration" required min="1" placeholder="30">
                        </div>

                        <div class="form-group">
                            <label for="intensity">Intensity</label>
                            <select id="intensity" required>
                                <option value="light">Light</option>
                                <option value="moderate">Moderate</option>
                                <option value="hard">Hard</option>
                                <option value="extreme">Extreme</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="sets">Sets (if applicable)</label>
                            <input type="number" id="sets" min="0" placeholder="0">
                        </div>

                        <div class="form-group">
                            <label for="reps">Reps (if applicable)</label>
                            <input type="number" id="reps" min="0" placeholder="0">
                        </div>

                        <div class="form-group">
                            <label for="distance">Distance (if applicable)</label>
                            <input type="number" id="distance" min="0" step="0.1" placeholder="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <input type="text" id="notes" placeholder="How did you feel?">
                    </div>

                    <div class="text-center mt-20">
                        <button type="submit">Complete Training Session</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Achievements View -->
        <div id="achievementsView" class="view">
            <h2 class="mb-20">Hall of Glory</h2>
            <div class="achievement-grid" id="achievementGrid">
                <!-- Achievements will be populated here -->
            </div>
        </div>

        <!-- History View -->
        <div id="historyView" class="view">
            <div class="quest-container">
                <div class="quest-header">
                    <h2>Training History</h2>
                    <button onclick="exportData()">Export Data</button>
                </div>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Exercise</th>
                            <th>Type</th>
                            <th>Duration</th>
                            <th>XP Gained</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <!-- History will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Settings View -->
        <div id="settingsView" class="view">
            <div class="quest-container">
                <h2 class="mb-20">Settings & Data Management</h2>
                
                <div class="form-group">
                    <button onclick="exportData()">📦 Export All Data (JSON)</button>
                </div>

                <div class="form-group">
                    <label for="importFile">Import Data</label>

        const DB_NAME = 'QuestForFitnessDB';
        const DB_VERSION = 1;

        // Initialize IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;

                    // Character Store
                    if (!db.objectStoreNames.contains('character')) {
                        db.createObjectStore('character', { keyPath: 'id' });
                    }

                    // Workouts Store
                    if (!db.objectStoreNames.contains('workouts')) {
                        const workoutStore = db.createObjectStore('workouts', { keyPath: 'id', autoIncrement: true });
                        workoutStore.createIndex('date', 'date', { unique: false });
                    }

                    // Quests Store
                    if (!db.objectStoreNames.contains('quests')) {
                        db.createObjectStore('quests', { keyPath: 'id', autoIncrement: true });
                    }

                    // Achievements Store
                    if (!db.objectStoreNames.contains('achievements')) {
                        db.createObjectStore('achievements', { keyPath: 'id' });
                    }
                };
            });
        }

        // Database Operations
        function saveToStore(storeName, data) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readwrite');
                const store = transaction.objectStore(storeName);
                const request = store.put(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function getFromStore(storeName, key) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.get(key);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function getAllFromStore(storeName) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([storeName], 'readonly');
                const store = transaction.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        // Roll 4d6 drop lowest
        function roll4d6DropLowest() {
            const rolls = [
                Math.floor(Math.random() * 6) + 1,
                Math.floor(Math.random() * 6) + 1,
                Math.floor(Math.random() * 6) + 1,
                Math.floor(Math.random() * 6) + 1
            ];
            rolls.sort((a, b) => a - b);
            return rolls[1] + rolls[2] + rolls[3]; // Drop lowest (index 0)
        }

        function getModifier(score) {
            return Math.floor((score - 10) / 2);
        }

        const xpTable = [
            0, 300, 900, 2700, 6500, 14000, 23000, 34000, 48000, 64000,
            85000, 100000, 120000, 140000, 165000, 195000, 225000, 265000, 305000, 355000
        ];

        function getXPForLevel(level) {
            return xpTable[level - 1] || 0;
        }

        function getLevelFromXP(xp) {
            for (let i = xpTable.length - 1; i >= 0; i--) {
                if (xp >= xpTable[i]) {
                    return i + 1;
                }
            }
            return 1;
        }

                wis: roll4d6DropLowest(),
                cha: roll4d6DropLowest()

            const classMods = classStats[className] || {};
            for (let stat in classMods) {
                baseStats[stat] += classMods[stat];
                if (baseStats[stat] < 3) baseStats[stat] = 3;
                if (baseStats[stat] > 20) baseStats[stat] = 20;

            }

            else xpReward = goal * 50;

            const quest = {
                id: Date.now(),

                title,
                description,
                goal,
                progress: 0,
                unit,
                xpReward: Math.floor(xpReward),

                light: 1,
                moderate: 1.5,
                hard: 2,
                extreme: 2.5
            }[workout.intensity];
            
            const xpGained = Math.floor(baseXP * intensityMultiplier);

            await saveToStore('workouts', workout);

            // Update character XP and stats
            await updateCharacterProgress(workout, xpGained);

        async function updateCharacterProgress(workout, xpGained) {
            const character = await getFromStore('character', 'main');
            
            // Add XP
            const oldLevel = character.level;
            character.xp += xpGained;
            character.level = getLevelFromXP(character.xp);

            // Apply stat bonuses from exercise type
            const statBonuses = exerciseStatBonus[workout.exerciseType] || {};
            for (let stat in statBonuses) {
                character.stats[stat] = Math.min(character.stats[stat] + statBonuses[stat], 30);
            }

            // Level up bonuses
            if (character.level > oldLevel) {
                const levelsGained = character.level - oldLevel;
                for (let i = 0; i < levelsGained; i++) {
                    // Add +1 to a random stat on level up
                    const stats = Object.keys(character.stats);
                    const randomStat = stats[Math.floor(Math.random() * stats.length)];
                    character.stats[randomStat] = Math.min(character.stats[randomStat] + 1, 30);
                }
                showNotification('LEVEL UP!', `You are now level ${character.level}!`, 'gold');
            }

            await saveToStore('character', character);
        }

        async function updateQuests(workout) {
            const quests = await getAllFromStore('quests');
            
            for (let quest of quests) {
                let progressAdded = 0;

                // Daily quests - any exercise
                if (quest.type === 'daily' && quest.unit === 'minutes') {
                    progressAdded = workout.duration;
                }

                // Strength training specific
                if (quest.title.toLowerCase().includes('strength') && workout.exerciseType === 'strength') {
                    progressAdded = workout.duration;
                }

                // Cardio specific
                if (quest.title.toLowerCase().includes('cardio') && workout.exerciseType === 'cardio') {
                    progressAdded = 1; // One session
                }

                // Weekly/Epic - consecutive days
                if ((quest.type === 'weekly' || quest.type === 'epic') && quest.unit === 'days') {
                    const today = new Date().toDateString();
                    const workouts = await getAllFromStore('workouts');
                    const todayWorkouts = workouts.filter(w => 
                        new Date(w.date).toDateString() === today
                    );
                    if (todayWorkouts.length === 1) { // First workout today
                        progressAdded = 1;
                    }
                }

                if (progressAdded > 0) {
                    quest.progress = Math.min(quest.progress + progressAdded, quest.goal);
                    
                    // Quest completed!
                    if (quest.progress >= quest.goal && !quest.completed) {
                        quest.completed = true;
                        await completeQuest(quest);
                    }
                    
                    await saveToStore('quests', quest);
                }
            }

            await loadQuests();
        }

        async function completeQuest(quest) {
            const character = await getFromStore('character', 'main');
            
            // Award XP
            character.xp += quest.xpReward;
            
            // Award stat bonuses
            if (quest.statBonus) {
                for (let stat in quest.statBonus) {
                    character.stats[stat] = Math.min(character.stats[stat] + quest.statBonus[stat], 30);
                }
            }
            
            await saveToStore('character', character);
            showNotification('QUEST COMPLETE!', `${quest.title} - Earned ${quest.xpReward} XP!`, 'gold');
        }

                if (Math.random() < dropChance) {

            }
        }

        async function checkAchievements() {
            const character = await getFromStore('character', 'main');

            await unlockAchievement('level_10', character.level >= 10);
            await unlockAchievement('level_20', character.level >= 20);

            await unlockAchievement('workouts_50', workouts.length >= 50);
            await unlockAchievement('workouts_100', workouts.length >= 100);

            const totalHours = totalMinutes / 60;
            await unlockAchievement('total_hours_10', totalHours >= 10);
            await unlockAchievement('total_hours_50', totalHours >= 50);
            await unlockAchievement('total_hours_100', totalHours >= 100);

            await unlockAchievement('dex_master', character.stats.dex >= 20);
            await unlockAchievement('con_master', character.stats.con >= 20);

            // Streak (simplified - checking consecutive days with workouts)
            const streak = calculateStreak(workouts);
            await unlockAchievement('streak_7', streak >= 7);
            await unlockAchievement('streak_30', streak >= 30);

            // Quest achievements

        async function unlockAchievement(id, condition) {
            if (!condition) return;

            const achievement = await getFromStore('achievements', id);
            if (achievement && !achievement.unlocked) {
                achievement.unlocked = true;
                achievement.unlockedDate = new Date().toISOString();
                await saveToStore('achievements', achievement);
                showNotification('🏆 ACHIEVEMENT UNLOCKED!', achievement.name, 'gold');
            }
        }

        function calculateStreak(workouts) {
            if (workouts.length === 0) return 0;

            workouts.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            let streak = 1;
            let currentDate = new Date(workouts[0].date);
            currentDate.setHours(0, 0, 0, 0);

            for (let i = 1; i < workouts.length; i++) {
                const workoutDate = new Date(workouts[i].date);
                workoutDate.setHours(0, 0, 0, 0);
                
                const dayDiff = Math.floor((currentDate - workoutDate) / (1000 * 60 * 60 * 24));
                
                if (dayDiff === 1) {
                    streak++;
                    currentDate = workoutDate;
                } else if (dayDiff > 1) {
                    break;
                }
            }

            return streak;
        }

        // Data Management
        async function exportData() {
            const data = {
                character: await getFromStore('character', 'main'),
                workouts: await getAllFromStore('workouts'),
                quests: await getAllFromStore('quests'),
                achievements: await getAllFromStore('achievements'),
                exportDate: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `quest-for-fitness-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    
                    if (data.character) await saveToStore('character', data.character);
                    if (data.workouts) {
                        for (let workout of data.workouts) {
                            await saveToStore('workouts', workout);
                        }
                    }
                    if (data.quests) {
                        for (let quest of data.quests) {
                            await saveToStore('quests', quest);
                        }
                    }
                    if (data.achievements) {
                        for (let achievement of data.achievements) {
                            await saveToStore('achievements', achievement);
                        }
                    }

                    showNotification('Data Imported!', 'Your progress has been restored!');
                    loadCharacter();
                } catch (err) {
                    alert('Error importing data: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        async function resetCharacter() {
            if (!confirm('Are you sure you want to reset your character? This cannot be undone!')) return;

            const transaction = db.transaction(['character'], 'readwrite');
            await transaction.objectStore('character').delete('main');
            
            location.reload();
        }

        async function clearAllData() {
            if (!confirm('This will delete ALL data including workouts, quests, and achievements. Are you ABSOLUTELY sure?')) return;
            if (!confirm('Last chance! This action cannot be undone!')) return;

            const stores = ['character', 'workouts', 'quests', 'achievements'];
            for (let store of stores) {
                const transaction = db.transaction([store], 'readwrite');
                await transaction.objectStore(store).clear();
            }

            location.reload();
        }

                max-width: 300px;

                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);

            `;
            notification.innerHTML = `

                <p style="color: var(--text-dim);">${message}</p>

            document.body.appendChild(notification);

            setTimeout(() => {
